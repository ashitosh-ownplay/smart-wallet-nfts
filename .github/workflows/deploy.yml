name: Deploy

on:
  push:
    branches:
      - main
      - dev

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Setup Node
        uses: actions/setup-node@v3

      - name: Install dependencies
        run: yarn install

      - name: Create .env file
        run: |
          if [ "${{ github.ref }}" == "refs/heads/main" ]; then
            echo "VITE_CHAIN_ID=${{ secrets.VITE_CHAIN_ID_PROD }}" >> .env
          elif [ "${{ github.ref }}" == "refs/heads/dev" ]; then
            echo "VITE_CHAIN_ID=${{ secrets.VITE_CHAIN_ID_DEV }}" >> .env
          fi
          if [ "${{ github.ref }}" == "refs/heads/main" ]; then
            echo "VITE_TW_CLIENT_ID_PROD=${{ secrets.VITE_TW_CLIENT_ID_PROD }}" >> .env
          elif [ "${{ github.ref }}" == "refs/heads/dev" ]; then
            echo "VITE_TW_CLIENT_ID=${{ secrets.VITE_TW_CLIENT_ID }}" >> .env
          fi

      - name: Build project
        run: |
          if [ "${{ github.ref }}" == "refs/heads/main" ]; then
            yarn run build --mode production
          elif [ "${{ github.ref }}" == "refs/heads/dev" ]; then
            yarn run build --mode development
          fi

      - name: Upload production artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v3
        with:
          name: production-artifact
          path: ./dist

      - name: Upload development artifact
        if: github.ref == 'refs/heads/dev'
        uses: actions/upload-artifact@v3
        with:
          name: development-artifact
          path: ./dist

  deploy-prod:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Download production artifact
        uses: actions/download-artifact@v3
        with:
          name: production-artifact

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist

  deploy-dev:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/dev'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Download development artifact
        uses: actions/download-artifact@v3
        with:
          name: development-artifact

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
